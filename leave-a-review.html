<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review | Top That Roofing</title>
<meta name="keywords" content="review">
<meta property="og:title" content="Help us. Help others. | Top That Roofing">
<meta property="og:description" content="How did we do? Leave Top That Roofing a few kind words.">
<link rel="icon" href="favicon.svg">
<style>
  :root{--navy:#14213d;--accent:#e63f1f;--bg:#f6f7fa}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .card{max-width:480px;width:100%;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(20,33,61,.12);padding:40px 32px;text-align:center}
  .logo{max-width:260px;height:auto;margin-bottom:24px}
  .tagline{font-family:"Barlow Condensed",Arial Narrow,Arial,sans-serif;font-weight:800;font-size:1.9rem;letter-spacing:.5px;margin:0 0 8px}
  .sub{color:#475569;font-size:1.05rem;margin:0 0 28px}
  .stars{color:#f5a623;font-size:1.3rem;letter-spacing:2px;margin-bottom:4px}
  .stat{font-size:.95rem;color:#64748b;margin-bottom:28px}
  .prompt{font-weight:700;font-size:1.15rem;margin-bottom:20px}
  .options{display:flex;flex-direction:column;gap:14px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:12px;border:2px solid #e2e8f0;background:#fff;font-size:1.05rem;font-weight:600;color:var(--navy);text-decoration:none;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
  .opt:hover{border-color:var(--accent);transform:translateY(-1px)}
  .opt .emoji{font-size:1.6rem;line-height:1}
  .opt.good{border-color:#16a34a1a;background:#f0fdf4}
  .opt.bad{border-color:#e2e8f0}
  footer{margin-top:28px;font-size:.8rem;color:#94a3b8}
  a{color:inherit}
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.svg" alt="Top That Roofing logo">
    <p class="tagline">Help us. Help others.</p>
    <p class="sub">Got a minute? Leave us a few kind words.</p>

    <div class="stars">★★★★★</div>
    <p class="stat">Our goal was to give you a 5 star experience. How did we do?</p>

    <div class="options">
      <a class="opt good" href="https://search.google.com/local/writereview?placeid=ChIJH72OsUQ8L4cR8xOGJlUPA9M" target="_blank" rel="noopener">
        <span class="emoji">😃</span> I had a great experience!
      </a>
      <a class="opt bad" href="review-feedback.html">
        <span class="emoji">😕</span> I was disappointed.
      </a>
    </div>

    <footer>Top That Roofing · Snowflake, AZ · (928) 536-4480</footer>
  </div>
</body>
</html>
